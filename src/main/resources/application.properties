spring.application.name=peixaria
server.port=8081

# Configurações do Banco de Dados H2 em modo arquivo local (os dados não somem ao fechar)
spring.datasource.url=jdbc:h2:file:./data/peixaria_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mantém os dados salvos e atualiza apenas a estrutura se precisar (nunca apaga os dados)
spring.jpa.hibernate.ddl-auto=update

# Habilita o console do H2 no navegador para você ver o banco rodando em http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console